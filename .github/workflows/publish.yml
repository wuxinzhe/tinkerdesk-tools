name: Publish Tools

# 单仓库 monorepo：检测 packages/* 任一工具变更 → 自动发布该 npm 包
on:
  push:
    branches: [main]
    paths:
      - 'packages/*/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Detect changed packages
        id: changed
        run: |
          PREV="${{ github.event.before }}"
          if [ "$PREV" = "0000000000000000000000000000000000000000" ]; then
            # 首次推送——发布全部工具包
            ls packages | sort -u | tee /tmp/changed.txt
          else
            git diff --name-only "$PREV" HEAD -- 'packages/*/**' \
              | cut -d/ -f2 | sort -u | tee /tmp/changed.txt
          fi

      - name: Bump version from npm latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ ! -s /tmp/changed.txt ]; then exit 0; fi
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            [ -f "packages/$pkg/package.json" ] || continue
            echo "🔧 $pkg: bump from npm latest +1 ..."
            (cd "packages/$pkg" && \
              NAME=$(node -p "require('./package.json').name") && \
              LATEST=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0") && \
              NEW=$(node -e "const s='$LATEST'.split('.').map(Number); console.log([s[0],s[1],(s[2]||0)+1].join('.'))") && \
              CUR=$(node -p "require('./package.json').version") && \
              if [ "$NEW" != "$CUR" ]; then npm version "$NEW" --no-git-tag-version; fi && \
              # 同步 manifest.json version（工具中心读 manifest 不是 package.json）
              if [ -f manifest.json ]; then
                node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version='$NEW';fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')" && \
                echo "   → manifest.json version 同步为 $NEW"
              fi && \
              echo "   → $NAME@$NEW")
          done < /tmp/changed.txt

      # 一致性校验：发布前确保每个变更包 package.json.version == manifest.json.version
      - name: Verify manifest version sync
        run: |
          if [ ! -s /tmp/changed.txt ]; then exit 0; fi
          FAIL=0
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            [ -f "packages/$pkg/package.json" ] || continue
            [ -f "packages/$pkg/manifest.json" ] || continue
            PV=$(node -p "require('./packages/$pkg/package.json').version")
            MV=$(node -p "require('./packages/$pkg/manifest.json').version")
            if [ "$PV" != "$MV" ]; then
              echo "❌ $pkg: package.json=$PV vs manifest.json=$MV 不一致"
              FAIL=1
            else
              echo "✅ $pkg: $PV 一致"
            fi
          done < /tmp/changed.txt
          [ "$FAIL" = "0" ] || { echo "版本不一致——请修复后重试"; exit 1; }

      # 装依赖（TS 包 prepublishOnly 需要 tsc——workspaces 根安装）
      - name: Install dependencies
        run: npm install

      # 逐个发布（基于 npm 已发布 latest 递增——不发回购仓 version）
      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ ! -s /tmp/changed.txt ]; then
            echo "✅ 没有工具包变更"
            exit 0
          fi
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            [ -f "packages/$pkg/package.json" ] || { echo "⏭️  $pkg 无 package.json——跳过"; continue; }
            echo "📦 发布 $pkg ..."
            (cd "packages/$pkg" && npm publish)
            echo "✅ $pkg 已发布"
          done < /tmp/changed.txt
